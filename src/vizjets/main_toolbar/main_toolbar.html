<!-- Main toolbar (N0.3). Each button names an Action (data-action); its tooltip is the
     Action's label and shortcut. -->
<div class="Toolbar" role="toolbar" aria-label="Toolbar" data-aria-label-key="Aria/Toolbar">
  <button class="ToolbarButton" data-action="view.commandPalette">
    <img class="ToolbarIcon" src="icons/command_palette_icn.svg" alt="">
  </button>
  <button class="ToolbarButton" data-action="dev.toggleDevTools">
    <img class="ToolbarIcon" src="icons/wrench_icn.png" alt="">
  </button>
</div>
