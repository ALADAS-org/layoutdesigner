<!-- Preferences dialog (N0.5 step 6) — after Inkscape. Contract: docs/contracts/PREFERENCES.md §1.
     Categories on the left, the selected one's page on the right; changes apply at once.
     A category appears only when it holds a real preference. -->
<div class="PreferencesDialog">
  <div class="PreferencesCategories" role="tablist" aria-orientation="vertical">
    <button class="PreferencesCategory" type="button" role="tab" data-category="interface"
            data-label-key="Preferences/Interface">Interface</button>
    <button class="PreferencesCategory" type="button" role="tab" data-category="plugins"
            data-label-key="Preferences/Plugins" hidden>Plugins</button>
    <button class="PreferencesCategory" type="button" role="tab" data-category="system"
            data-label-key="Preferences/System">System</button>
  </div>
  <div class="PreferencesPages">
    <section class="PreferencesPage" role="tabpanel" data-category="interface">
      <h3 class="PreferencesPageTitle" data-label-key="Preferences/Interface">Interface</h3>
      <div class="PreferencesRow">
        <label for="preferences_language" data-label-key="Preferences/Language">Language</label>
        <select class="PreferencesLanguage" id="preferences_language"></select>
      </div>
      <p class="PreferencesHelp" data-label-key="Preferences/LanguageHelp">Saved at once; applied when Layout Designer restarts.</p>
      <div class="PreferencesRow">
        <label for="preferences_theme" data-label-key="Preferences/Theme">Theme</label>
        <select class="PreferencesTheme" id="preferences_theme">
          <option value="dark" data-label-key="Preferences/ThemeDark">Dark</option>
          <option value="light" data-label-key="Preferences/ThemeLight">Light</option>
        </select>
      </div>
      <p class="PreferencesHelp" data-label-key="Preferences/ThemeHelp">Applied at once.</p>
    </section>
    <!-- N0.6 (PLUGIN_API.md §15): one row per plugin; shown only when there are plugins.
         N0.6 bis (PLUGIN_DEPENDENCIES.md §6): bulk actions after Gmail — a row's check box
         selects it; select-all box, then the action, then Apply on its right. -->
    <section class="PreferencesPage" role="tabpanel" data-category="plugins" hidden>
      <h3 class="PreferencesPageTitle" data-label-key="Preferences/Plugins">Plugins</h3>
      <div class="PreferencesPluginsBulk">
        <input type="checkbox" class="PreferencesPluginsSelectAll" aria-label="Select all plugins"
               data-aria-label-key="Preferences/PluginsSelectAll">
        <select class="PreferencesPluginsAction" aria-label="Action" data-aria-label-key="Preferences/PluginsAction">
          <option value="disable" data-label-key="Preferences/PluginsDisable">Disable</option>
          <option value="enable" data-label-key="Preferences/PluginsEnable">Enable</option>
        </select>
        <button class="PreferencesPluginsApply" type="button" data-label-key="Preferences/PluginsApply">Apply</button>
        <span class="PreferencesPluginsCount"></span>
      </div>
      <div class="PreferencesPlugins"></div>
      <p class="PreferencesHelp" data-label-key="Preferences/PluginsHelp">Saved at once; applied when Layout Designer restarts.</p>
    </section>
    <section class="PreferencesPage" role="tabpanel" data-category="system" hidden>
      <h3 class="PreferencesPageTitle" data-label-key="Preferences/System">System</h3>
      <div class="PreferencesRow">
        <span data-label-key="Preferences/File">Preferences file</span>
        <span class="PreferencesFile"></span>
      </div>
      <div class="PreferencesRow">
        <span></span>
        <span><button class="PreferencesReset" type="button" data-label-key="Preferences/Reset">Reset preferences</button></span>
      </div>
      <p class="PreferencesHelp" data-label-key="Preferences/ResetHelp">Restores the defaults of preferences.default.json. The current file is kept as preferences.json.bak.</p>
    </section>
  </div>
</div>
<!-- N0.6 bis: confirmation when Apply would leave a plugin blocked (PLUGIN_DEPENDENCIES.md §6). -->
<div class="PreferencesPluginsConfirm" hidden>
  <p class="PreferencesPluginsConfirmMessage"></p>
  <ul class="PreferencesPluginsConfirmList"></ul>
  <label class="PreferencesPluginsConfirmAlso"><input type="checkbox" checked> <span></span></label>
</div>
