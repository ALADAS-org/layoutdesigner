<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype panneau du bas</title>
<style>
:root{--bg:#1e1e1e;--bar:#2a2a2a;--doc:#151515;--border:#3a3a3a;--text:#e6e6e6;--muted:#9a9a9a;--accent:#4a9eff;--splitter:#888780;--splitter-hover:#b4b2a9;--btn-border:#8a8a8a}
:root[data-theme="light"]{--bg:#f3f3f3;--bar:#e8e8e8;--doc:#ffffff;--border:#cfcfcf;--text:#1e1e1e;--muted:#666;--accent:#1a6fd6;--splitter:#888780;--splitter-hover:#5f5e5a;--btn-border:#555}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:13px system-ui,sans-serif}
.win{max-width:900px;margin:auto;border:1px solid var(--border);user-select:none}
.bar{display:flex;align-items:center;gap:16px;padding:4px 10px;background:var(--bar);border-bottom:1px solid var(--border)}
.cc{width:300px;margin:auto;border:1px solid var(--border);border-radius:5px;padding:3px 10px;color:var(--muted);display:flex;justify-content:space-between}
.doc{display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--doc)}
.split{height:4px;cursor:row-resize;background:var(--splitter)}
.split:hover{background:var(--splitter-hover)}
.tog{width:20px;height:20px;padding:0;border:1px solid var(--btn-border);border-radius:0;background:var(--bar);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center}
.tog svg{width:12px;height:12px}
.tab{padding:6px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.log{font:12px/1.6 Consolas,monospace;padding:6px 12px;overflow:auto;color:var(--muted)}
.status{padding:3px 10px;font-size:12px;color:var(--muted);background:var(--bar);border-top:1px solid var(--border)}
select{background:var(--bar);color:var(--text);border:1px solid var(--border);height:22px}
.note{max-width:900px;margin:10px auto 0;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="win">
  <div class="bar" style="gap:18px"><span>File</span><span>View</span><span style="margin-left:auto">Help</span></div>
  <div class="bar"><div class="cc"><span>Search commands</span><span>Ctrl+Shift+P</span></div></div>
  <div class="doc" id="doc">Zone de document</div>
  <div class="split" id="split" title="Glisser pour redimensionner"></div>
  <div class="bar" style="padding:0 8px;gap:4px">
    <button class="tog" id="tog" aria-label="Plier / déplier le panneau"><svg id="arrow" viewBox="0 0 12 12"><path d="M2 4 L6 8 L10 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <span class="tab on" data-t="console">Console</span>
    <span class="tab" data-t="output">Output</span>
    <select id="chan" style="margin-left:auto;visibility:hidden"><option>Layout Designer</option><option>ld-dummy-server</option><option>ld-dummy-renderer</option></select>
  </div>
  <div class="log" id="body"></div>
  <div class="status">Barre d'état</div>
</div>
<p class="note">Thème : <button id="theme">clair / sombre</button></p>
<script>
const logs={console:["[info]  22:25:01  Labels loaded: fr","[info]  22:25:01  6 Actions registered","[warn]  22:25:02  Plugin 'broken-demo' not loaded: entry not found","[info]  22:25:07  Action view.toggleTheme"],
output:{"Layout Designer":["Layout Designer 0.0.0 started","Preferences: src/config/preferences.json"],"ld-dummy-server":["Hello from a server plugin (Node.js 22.x)"],"ld-dummy-renderer":["Hello from a renderer plugin"]}};
let tab="console",open=true,h=140;const TOTAL=420;
const $=id=>document.getElementById(id);
function render(){
  const lines=tab==="console"?logs.console:logs.output[$("chan").value];
  $("body").innerHTML=lines.map(l=>"<div>"+l+"</div>").join("");
  $("chan").style.visibility=tab==="output"?"visible":"hidden";
  $("body").style.display=open?"block":"none";$("body").style.height=h+"px";
  $("doc").style.height=(TOTAL-(open?h:0))+"px";
  $("split").style.visibility=open?"visible":"hidden";
  $("arrow").firstElementChild.setAttribute("d",open?"M2 4 L6 8 L10 4":"M4 2 L8 6 L4 10");
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));t.classList.add("on");tab=t.dataset.t;open=true;render();});
$("tog").onclick=()=>{open=!open;render();};
$("chan").onchange=render;
$("theme").onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";};
let y0=null,h0=0;const s=$("split");
s.onpointerdown=e=>{y0=e.clientY;h0=h;s.setPointerCapture(e.pointerId);};
s.onpointermove=e=>{if(y0===null)return;h=Math.max(60,Math.min(340,Math.round(h0-(e.clientY-y0))));render();};
s.onpointerup=()=>{y0=null;};
render();
</script>
</body>
</html>
